<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>Pad</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif;color:#fff}
#st{position:fixed;top:6px;left:0;right:0;text-align:center;font-size:12px;opacity:.6}
#tvurl{position:fixed;top:26px;left:8px;right:8px;text-align:center;font-size:20px;font-weight:bold;color:#ffd54f}
#base{position:fixed;left:8vw;bottom:14vh;width:34vh;height:34vh;border-radius:50%;background:#222;border:2px solid #444}
#knob{position:absolute;left:50%;top:50%;width:14vh;height:14vh;margin:-7vh 0 0 -7vh;border-radius:50%;background:#4dd0e1}
.b{position:fixed;width:16vh;height:16vh;border-radius:50%;background:#333;border:2px solid #666;display:flex;align-items:center;justify-content:center;font-size:6vh;font-weight:bold}
.b.on{background:#ffd54f;color:#000}
#a{right:8vw;bottom:12vh}#b{right:8vw;bottom:32vh}#c{right:26vw;bottom:12vh}#d{right:26vw;bottom:32vh}
#rot{display:none;position:fixed;inset:0;background:#111;align-items:center;justify-content:center;font-size:18px;z-index:9}
@media (orientation:portrait){#rot{display:flex}}
</style></head><body>
<div id="rot">Rotate your phone sideways</div>
<div id="st">connecting…</div>
<div id="tvurl"></div>
<div id="base"><div id="knob"></div></div>
<div class="b" id="a">A</div><div class="b" id="b">B</div><div class="b" id="c">X</div><div class="b" id="d">Y</div>
<script>
var st=document.getElementById('st'),base=document.getElementById('base'),knob=document.getElementById('knob');
var ws,state={t:'in',x:0,y:0,a:0,b:0,c:0,d:0},last='',joyTouch=null,btnTouch={};
function conn(){
  ws=new WebSocket('ws://'+location.host+'/ws?role=pad');
  ws.onopen=function(){st.textContent='connected'};
  ws.onmessage=function(e){var m=JSON.parse(e.data);if(m.t==='hello')st.textContent='Player '+m.p+' ready'};
  ws.onclose=function(){st.textContent='reconnecting…';setTimeout(conn,1000)};
}
conn();
var tvu=document.getElementById('tvurl');
function info(){
  fetch('/info').then(function(r){return r.json()}).then(function(j){
    tvu.textContent=j.tv.length?'Now open the TV Pad app on your TV (it connects by itself)':'Turn ON your phone Hotspot and connect the TV to it';
  }).catch(function(){});
}
info();setInterval(info,5000);
function push(force){
  var s=JSON.stringify(state);
  if((force||s!==last)&&ws&&ws.readyState===1){ws.send(s);last=s}
}
setInterval(function(){push(false)},25);
function joy(t){
  var r=base.getBoundingClientRect(),R=r.width/2;
  var dx=t.clientX-(r.left+R),dy=t.clientY-(r.top+R),d=Math.hypot(dx,dy);
  if(d>R){dx*=R/d;dy*=R/d}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  state.x=+(dx/R).toFixed(2);state.y=+(dy/R).toFixed(2);
}
function reset(){knob.style.transform='';state.x=0;state.y=0;joyTouch=null}
function inRect(el,t){var r=el.getBoundingClientRect();return t.clientX>=r.left-20&&t.clientX<=r.right+20&&t.clientY>=r.top-20&&t.clientY<=r.bottom+20}
function hit(t){
  var r=base.getBoundingClientRect();
  if(t.clientX<innerWidth*0.5&&joyTouch===null){joyTouch=t.identifier;joy(t);return}
  ['a','b','c','d'].forEach(function(k){
    var el=document.getElementById(k);
    if(inRect(el,t)){btnTouch[t.identifier]=k;state[k]=1;el.classList.add('on');if(navigator.vibrate)navigator.vibrate(8)}
  });
}
document.addEventListener('touchstart',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++)hit(e.changedTouches[i]);push(true)},{passive:false});
document.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joyTouch)joy(t)}},{passive:false});
function end(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===joyTouch)reset();
    var k=btnTouch[t.identifier];
    if(k){state[k]=0;document.getElementById(k).classList.remove('on');delete btnTouch[t.identifier]}
  }
  push(true);
}
document.addEventListener('touchend',end);document.addEventListener('touchcancel',end);
document.addEventListener('contextmenu',function(e){e.preventDefault()});
try{if(navigator.wakeLock)document.addEventListener('touchstart',function(){navigator.wakeLock.request('screen').catch(function(){})},{once:true})}catch(e){}
</script></body></html>
