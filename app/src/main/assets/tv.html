<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orb Arena</title>
<style>
html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;font-family:sans-serif;color:#fff}
canvas{display:block}
#join{position:fixed;left:0;right:0;top:4vh;text-align:center;font-size:3vh;opacity:.9;text-shadow:0 0 8px #000}
#join b{color:#ffd54f;font-size:4vh}
</style></head><body>
<canvas id="c"></canvas>
<div id="join">Connecting…</div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),joinEl=document.getElementById('join');
var W=0,H=0;
function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight}
fit();window.onresize=fit;

var players={},stars=[],colors=['#ff5d73','#4dd0e1','#ffd54f','#81c784','#ba68c8','#ff8a65','#90caf9','#f48fb1'];
function rnd(a,b){return a+Math.random()*(b-a)}
function addPlayer(id){
  if(players[id])return;
  players[id]={x:rnd(100,W-100),y:rnd(100,H-100),vx:0,vy:0,i:{x:0,y:0,a:0,b:0},score:0,color:colors[(id-1)%colors.length],dash:0,cool:0};
}
function removePlayer(id){delete players[id]}
for(var k=0;k<8;k++)stars.push({x:rnd(40,W-40),y:rnd(40,H-40)});

var joinUrl=location.host+'/c';
function count(){return Object.keys(players).length}
function showJoin(){
  joinEl.innerHTML=count()?'<b>'+count()+'</b> player'+(count()>1?'s':'')+' connected':'Open the <b>TV Pad</b> app on your phone and use the joystick';
}

var ws;
function conn(){
  ws=new WebSocket('ws://'+location.host+'/ws?role=tv');
  ws.onopen=function(){showJoin()};
  ws.onmessage=function(e){
    var m=JSON.parse(e.data);
    if(m.t==='list'){players={};m.ps.forEach(addPlayer)}
    else if(m.t==='join')addPlayer(m.p);
    else if(m.t==='leave')removePlayer(m.p);
    else if(m.t==='in'){addPlayer(m.p);players[m.p].i=m}
    showJoin();
  };
  ws.onclose=function(){joinEl.textContent='Reconnecting…';setTimeout(conn,1000)};
}
conn();

// keyboard fallback (player 0) for testing on a computer
var keys={};
window.onkeydown=function(e){keys[e.key.toLowerCase()]=1};
window.onkeyup=function(e){keys[e.key.toLowerCase()]=0};

var lastT=performance.now();
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  if(keys.w||keys.s||keys.a||keys.d||keys[' ']){
    addPlayer(0);
    players[0].i={x:(keys.d?1:0)-(keys.a?1:0),y:(keys.s?1:0)-(keys.w?1:0),a:keys[' ']?1:0,b:0};
  }
  var R=Math.min(W,H)*0.03,SP=Math.min(W,H)*0.55;
  for(var id in players){
    var p=players[id],i=p.i;
    var dead=0.12,ix=Math.abs(i.x)<dead?0:i.x,iy=Math.abs(i.y)<dead?0:i.y;
    p.cool-=dt;
    if(i.a&&p.cool<=0){p.dash=0.18;p.cool=1}
    p.dash-=dt;
    var s=SP*(p.dash>0?2.6:1);
    p.vx+=(ix*s-p.vx)*Math.min(1,dt*10);
    p.vy+=(iy*s-p.vy)*Math.min(1,dt*10);
    p.x=Math.max(R,Math.min(W-R,p.x+p.vx*dt));
    p.y=Math.max(R,Math.min(H-R,p.y+p.vy*dt));
    for(var k=stars.length-1;k>=0;k--){
      var st=stars[k];
      if(Math.hypot(st.x-p.x,st.y-p.y)<R+R*0.6){
        p.score++;stars[k]={x:rnd(40,W-40),y:rnd(40,H-40)};
      }
    }
  }
  ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffe082';
  stars.forEach(function(s){ctx.beginPath();ctx.arc(s.x,s.y,R*0.6,0,6.283);ctx.fill()});
  var y=H*0.1+30;
  for(var id in players){
    var p=players[id];
    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.dash>0?0.7:1;
    ctx.beginPath();ctx.arc(p.x,p.y,R*(p.dash>0?1.3:1),0,6.283);ctx.fill();
    ctx.globalAlpha=1;
    ctx.font=(H*0.03)+'px sans-serif';ctx.textAlign='left';
    ctx.fillText((id==0?'KB':'P'+id)+': '+p.score,20,y);y+=H*0.04;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
